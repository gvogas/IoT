{% extends "base.html" %}
{% block title %}Fridge Dashboard{% endblock %}
{% block main_class %}wide{% endblock %}

{% block content %}
    <div class="page-head">
        <h2>Fridges</h2>
        <p id="summary" role="status"></p>
    </div>
    <p id="message" role="status"></p>

    <!-- JS fills this with one tile per fridge -->
    <div id="fridges" class="fridge-tiles"></div>

    <section class="card fan-card" aria-labelledby="shared-fan-title">
        <img id="fan-image"
            data-on-src="{{ url_for('static', filename='images/fan_on.png') }}"
            data-off-src="{{ url_for('static', filename='images/fan_off.png') }}"
            src="{{ url_for('static', filename='images/fan_off.png') }}"
            alt="Fan status unknown"
            width="64" height="64">
        <div class="fan-info">
            <h3 id="shared-fan-title">Shared fan</h3>
            <p>Status: <b id="fan-state" role="status">UNKNOWN</b></p>
        </div>
        <p id="fan-message" role="status"></p>
        <button type="button" id="fan-off">Turn fan off</button>
    </section>

    <!-- Blueprint for a fridge tile. Not shown until JS clones it. -->
    <template id="tile-template">
        <a class="card fridge-tile">
            <div class="tile-head">
                <h3 class="fridge-name"></h3>
                <span class="fridge-status waiting"><span class="dot"></span><span class="status-text">Waiting</span></span>
            </div>

            <div class="tile-temp">
                <span class="temp-value"><span class="temp">--</span><span class="unit"> °C</span></span>
                <span class="trend muted">
                    <svg class="trend-arrow" width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9 H15 M10 4 L15 9 L10 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span class="trend-text"></span>
                </span>
            </div>

            <div class="limit-bar" aria-hidden="true">
                <div class="limit-track"><div class="limit-safe"></div></div>
                <div class="limit-mark"></div>
                <div class="limit-now"></div>
            </div>
            <div class="limit-labels"><span>0 °C</span><span class="limit-label">limit --</span><span class="scale-top">12 °C</span></div>

            <p class="tile-sentence"></p>

            <div class="tile-foot">
                <span>Humidity <b class="hum">--</b> %</span>
                <span class="last-reading">No reading yet</span>
            </div>
            <span class="tile-link">View details
                <svg width="14" height="14" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9 H15 M10 4 L15 9 L10 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
        </a>
    </template>

    <script src="{{ url_for('static', filename='js/fridge_common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fridge_dashboard.js') }}"></script>
{% endblock %}
