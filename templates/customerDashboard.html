<html>
    <head>
        
    </head>

    <body>
        <h2>
            Create Customer
        </h2>
        <p id="message" role="status"></p>
        <form id="customer-form" action="/submit" method="POST">
            <label for="name_input">Enter Name:</label>
            <input type="text" name="name">
            <br>
            <label for="address_input">Enter Address:</label>
            <input type="text" name="address">
            <br>
            <label for="email_input">Enter Email:</label>
            <input type="text" name="email">
            <br>
            <label for="number_input">Enter Phone Number:</label>
            <input type="text" name="phoneNumber">
            <br>
            <button type="submit">Enter Customer</button>
        </form> 
        <script>
            const form = document.getElementById("customer-form");
            const message = document.getElementById("message");

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                message.textContent = "";
                message.style.color = "";

                try {
                    const response = await fetch(form.action, {
                        method: "POST",
                        body: new FormData(form)
                    });
                    const result = await response.json();

                    message.textContent = result.error || result.success;
                    message.style.color = result.error ? "red" : "green";

                    if (response.ok) {
                        form.reset();
                    }
                } catch (error) {
                    message.textContent = "Unable to submit the form. Please try again.";
                    message.style.color = "red";
                }
            });
        </script>
    </body>

</html>
