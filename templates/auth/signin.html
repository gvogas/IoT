{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block main_class %}tiny{% endblock %}

{% block content %}
    <h1 class="mb-3">Sign in</h1>

    <div class="card">
        <div class="card-body">
            {% if error %}
            <div class="alert alert-danger py-2 px-3" role="alert">{{ error }}</div>
            {% endif %}

            <form action="/signin" method="POST">
                <div class="mb-3">
                    <label class="form-label" for="email_input">Email</label>
                    <input class="form-control" type="email" id="email_input" name="email" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password_input">Password</label>
                    <input class="form-control" type="password" id="password_input" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Sign in</button>
            </form>

            <div class="or-divider">or use your membership card</div>

            <form id="scan-form" autocomplete="off">
                <label class="form-label" for="scan-input">Membership number</label>
                <div class="d-flex gap-2">
                    <input class="form-control code" type="text" id="scan-input" name="membershipNumber" maxlength="32" placeholder="Scan your barcode">
                    <button class="btn btn-outline-primary text-nowrap" type="submit">Sign in</button>
                </div>
            </form>
            <div id="scan-message" class="mt-3" role="status" aria-live="polite" hidden></div>
        </div>
    </div>

    <p class="text-center text-secondary mt-3">No account yet? <a href="/signup">Sign up</a></p>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/auth/barcode_login.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth/signin.js') }}"></script>
{% endblock %}
