<!DOCTYPE html>
<!-- Every page uses this file for the menu. Each page starts with {% raw %}{% extends "base.html" %}{% endraw %} and puts its stuff in the content block -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Store{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        {% if session.role == "admin" %}
        <a href="/fridges">Fridges</a>
        <a href="/customers">Customers</a>
        {% elif session.id %}
        <a href="/account">My Account</a>
        {% endif %}

        {% if session.id %}
        <a href="/signout" class="right">Sign Out ({{ session.name }})</a>
        {% else %}
        <a href="/signin" class="right">Sign In</a>
        <a href="/signup">Sign Up</a>
        {% endif %}
    </nav>

    <main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
    </main>
</body>
</html>
