{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
        <form class="card signin-form" action="/signin" method="POST">
            <h2>Sign In</h2>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <label for="email_input">Email:</label>
            <input type="text" id="email_input" name="email" autocomplete="username" required>

            <label for="password_input">Password:</label>
            <input type="password" id="password_input" name="password" autocomplete="current-password" required>

            <button type="submit">Sign In</button>

            <p>No account yet? <a href="/signup">Sign up</a></p>
        </form>

        <div class="card signin-form" style="margin-top: 20px;">
            <h3>Sign in with your membership card</h3>
            <p class="muted">Scan the barcode on your card.</p>
            <form id="scan-form" autocomplete="off">
                <input type="text" id="scan-input" name="membershipNumber" autofocus maxlength="32" placeholder="Scan your membership barcode" aria-label="Membership number">
                <button type="submit">Sign In with Card</button>
            </form>
            <div id="scan-message" role="status" aria-live="polite" hidden></div>
        </div>

        <script src="{{ url_for('static', filename='js/signin.js') }}"></script>
{% endblock %}
