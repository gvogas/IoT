{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
        <form class="card signin-form" action="/signin" method="POST">
            <h2>Sign In</h2>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <label for="email_input">Email:</label>
            <input type="text" id="email_input" name="email" autocomplete="username" autofocus required>

            <label for="password_input">Password:</label>
            <input type="password" id="password_input" name="password" autocomplete="current-password" required>

            <button type="submit">Sign In</button>

            <p>No account yet? <a href="/signup">Sign up</a></p>
        </form>
{% endblock %}
