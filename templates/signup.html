{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
        <form id="customer-form" class="card" action="/submit" method="POST">
            <h2>
                Sign Up
            </h2>
            <p id="message" role="status"></p>

            <label for="name_input">Enter Name:</label>
            <input type="text" id="name_input" name="name">

            <label for="address_input">Enter Address:</label>
            <input type="text" id="address_input" name="address">

            <label for="email_input">Enter Email:</label>
            <input type="text" id="email_input" name="email">

            <label for="number_input">Enter Phone Number:</label>
            <input type="text" id="number_input" name="phoneNumber">

            <label for="password_input">Password:</label>
            <input type="password" id="password_input" name="password" autocomplete="new-password">

            <button type="submit">Enter Customer</button>
        </form>

        <script>
            const form = document.getElementById("customer-form");
            const message = document.getElementById("message");

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                message.textContent = "";
                message.style.color = "";

                try {
                    const response = await fetch(form.action, {
                        method: "POST",
                        body: new FormData(form)
                    });
                    const result = await response.json();

                    message.textContent = result.error || result.success;
                    message.style.color = result.error ? "red" : "green";

                    if (response.ok) {
                        form.reset();
                    }
                } catch (error) {
                    message.textContent = "Unable to submit the form. Please try again.";
                    message.style.color = "red";
                }
            });
        </script>
{% endblock %}
