{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block main_class %}narrow{% endblock %}

{% block content %}
    {# No card around it: the message is the only thing on the page #}
    <div class="empty-state error-card">
        <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
        <h1 class="h2">{{ title }}</h1>
        <p>{{ text }}</p>
        <a class="btn btn-primary" href="/">Back to the store</a>
    </div>
{% endblock %}
